<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Warm-Ups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6EDE7; --grid:#EEE2D8; --ink:#4A2A10; --muted:#7A5A43;
  --panel:#FFFBF7; --line:#DFCDBD; --olive:#5E6B1E;
  --tile:#F4DDB0; --tile-edge:#D2B07C; --made:#D3DFB4; --made-edge:#9DB074; --tile-ink:#4A2A10;
  --pick:#6E7D22; --ok:#5E6B1E; --warn:#A6372A;
  --s0:#D6A355; --s1:#C27A5B; --s2:#8FA27A; --s3:#A78BB4;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#271E18; --grid:#30251E; --ink:#F3E6D8; --muted:#C2AA94;
    --panel:#33281F; --line:#4E3E31; --olive:#BCCB6E; --pick:#BCCB6E; --ok:#BCCB6E; --warn:#F08A7A; color-scheme:dark; --s0:#E2B76E; --s1:#D9967A; --s2:#A9BC93; --s3:#BFA6CC;
  }
}
:root[data-theme="dark"]{
  --paper:#271E18; --grid:#30251E; --ink:#F3E6D8; --muted:#C2AA94;
  --panel:#33281F; --line:#4E3E31; --olive:#BCCB6E; --pick:#BCCB6E; --ok:#BCCB6E; --warn:#F08A7A; color-scheme:dark; --s0:#E2B76E; --s1:#D9967A; --s2:#A9BC93; --s3:#BFA6CC;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{margin:0 0 4px;color:var(--muted);font-size:15px;font-weight:600}
h1{margin:0;font-family:"Luckiest Guy","Poppins",system-ui,sans-serif;font-size:clamp(32px,7vw,46px);font-weight:400;letter-spacing:.01em;line-height:1;color:var(--olive)}
.date{margin:6px 0 0;color:var(--muted);font-size:15px}
.seg{display:inline-flex;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:18px -18px 0;padding:4px 18px 8px;scrollbar-width:thin}
.tab{white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px}
.tab[aria-current="page"]{background:var(--tile);border-color:var(--tile-edge);color:var(--tile-ink)}
.levelbar{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px}
.leveldesc{margin:0;color:var(--muted);font-size:14px}
.prompt{max-width:54ch;margin:16px auto 0;text-align:center;color:var(--muted);font-size:16px;line-height:1.5}
.prompt strong{color:var(--ink)}
.status{min-height:48px;text-align:center;font-size:16px;line-height:1.4;margin:10px auto 0;max-width:48ch}
.status.ok{color:var(--ok);font-weight:600}
.status.warn{color:var(--warn)}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.btn{font:inherit;font-size:15px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.newwrap{display:flex;justify-content:center;margin-top:22px}
[hidden]{display:none !important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--pick);outline-offset:3px}

.given{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:56px;padding:6px 12px;border-radius:14px;
  background:var(--tile);color:var(--tile-ink);font-weight:800;font-size:clamp(20px,5vw,26px);box-shadow:0 4px 0 var(--tile-edge);font-variant-numeric:tabular-nums}
.ans{font:inherit;font-weight:700;font-size:clamp(18px,5vw,24px);width:4.4em;text-align:center;border:2.5px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink);padding:8px 6px}
.ans.wide{width:6em}
.ans.good{border-color:var(--ok);color:var(--ok)}
.ans:disabled{opacity:1}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-size:.82em;margin:0 .08em}
.frac>span:last-child{border-top:2px solid currentColor;padding-top:2px;margin-top:2px;align-self:stretch;text-align:center}
sup{font-size:.6em;line-height:0}

.dots{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:16px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.miss{background:var(--warn);border-color:var(--warn)}
.dot.cur{border-color:var(--pick);transform:scale(1.3)}
.count{margin-left:8px;color:var(--muted);font-size:14px}
.stage{margin-top:12px}
.note{max-width:440px;margin:4px auto 0;background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:12px 16px;text-align:center;font-size:18px;line-height:1.6}
.summary{text-align:center;padding:24px 0}
.summary .big{font-size:56px;font-weight:800;margin:0}
.summary p{margin:4px 0;color:var(--muted)}

/* target */
.target{position:relative;margin:20px auto 4px;width:min(64vw,280px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle closest-side,var(--panel) 0 55%,var(--pick) 55% 59.5%,var(--panel) 59.5% 72%,var(--ink) 72% 74%,var(--panel) 74% 88%,var(--ink) 88% 90%,transparent 90%);
  display:grid;place-items:center}
.target .num{font-family:"Luckiest Guy","Poppins",system-ui,sans-serif;font-size:clamp(40px,14vw,72px);font-weight:400;letter-spacing:.01em;color:var(--olive);padding-top:.12em}
.target.hit{animation:hit .9s ease-out}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:10px auto 0;max-width:480px}
.tile{font:inherit;font-weight:800;font-size:clamp(24px,7vw,34px);font-variant-numeric:tabular-nums;min-width:clamp(68px,21vw,90px);height:clamp(68px,21vw,90px);padding:0 10px;
  border-radius:6px;border:0;cursor:pointer;color:var(--tile-ink);background:var(--tile);box-shadow:0 5px 0 var(--tile-edge);transition:transform .12s ease}
.tile.made{background:var(--made);box-shadow:0 5px 0 var(--made-edge)}
.tile.sel{outline:4px solid var(--pick);outline-offset:3px;transform:translateY(-3px)}
.tile.win{outline:4px solid var(--ok);outline-offset:3px}
.ops{display:flex;justify-content:center;gap:14px;margin-top:24px}
.op{font:inherit;font-size:30px;font-weight:600;width:62px;height:62px;border-radius:50%;border:2.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;line-height:1}
.op[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--paper)}
.work{margin:22px auto 0;max-width:420px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 18px}
.work h2{margin:0 0 6px;font-size:16px;font-weight:600}
.work ol{margin:0;padding-left:1.4em;font-size:20px;line-height:1.7;font-variant-numeric:tabular-nums}
.work .empty{margin:0;color:var(--muted);font-size:15px}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--muted);font-size:14px}
.solution{border-style:dashed}

/* triangle & diamond */
.tri,.diamond{position:relative;margin:8px auto 0;width:min(90vw,380px)}
.tri{aspect-ratio:300/260}
.diamond{aspect-ratio:1;margin-top:28px;margin-bottom:28px}
.tri svg,.diamond svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.node{position:absolute;transform:translate(-50%,-50%)}
.tri .top{left:50%;top:15.4%}.tri .left{left:18.3%;top:82.7%}.tri .right{left:81.7%;top:82.7%}
.tri .ans{width:4em;font-size:20px}
.tri-x{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-size:34px;font-weight:600;color:var(--muted)}
.diamond .top{left:50%;top:24%}.diamond .bottom{left:50%;top:76%}.diamond .left{left:22%;top:50%}.diamond .right{left:78%;top:50%}
.diamond .ans{width:3.4em;font-size:20px}
.diamond .given{min-width:56px;min-height:48px;font-size:22px}
.dlab{position:absolute;left:50%;transform:translateX(-50%);color:var(--muted);font-size:14px;font-weight:600}
.dtop{top:-24px}.dbot{bottom:-24px}

/* mystery */
.cluebox{max-width:460px;margin:16px auto 0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 18px}
.clues{margin:0;padding-left:1.5em;font-size:19px;line-height:1.5}
.clues li{margin:6px 0}
.clues li.locked{color:var(--muted);font-size:16px}
.guessrow{display:flex;justify-content:center;gap:10px;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{padding:4px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted);text-decoration:line-through;font-weight:600}
.chip.right{text-decoration:none;border-color:var(--ok);color:var(--ok)}

/* magic */
.magic{--cell:clamp(64px,19vw,84px);display:grid;grid-template-columns:repeat(3,var(--cell)) auto;gap:8px;justify-content:center;margin-top:18px}
.mcell{width:var(--cell);height:var(--cell);display:grid;place-items:center;border-radius:14px;border:2px solid var(--line);background:var(--panel)}
.mcell.given{background:var(--tile);border-color:var(--tile-edge);color:var(--tile-ink);font-weight:800;font-size:clamp(20px,5vw,26px)}
.mcell .ans{width:100%;height:100%;border:0;border-radius:12px;padding:0;font-size:clamp(17px,4.6vw,22px)}
.msum{display:grid;place-items:center;min-width:40px;min-height:36px;color:var(--muted);font-weight:600;font-size:16px}
.msum.ok{color:var(--ok)}.msum.off{color:var(--warn)}
.diag2{text-align:center;color:var(--muted);font-size:15px;margin:10px 0 0}
.diag2 .msum{display:inline-grid;min-height:0}

/* crunch */
.crunch{text-align:center;margin-top:18px}
.expr{font-size:clamp(26px,7vw,42px);font-weight:600;line-height:1.5;font-variant-numeric:tabular-nums}
.when{margin:6px 0 0;color:var(--muted);font-size:19px}
.eqrow{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px;font-size:30px;font-weight:600}

/* mobiles */
.mob{display:flex;justify-content:center;margin-top:8px}
.mob svg{width:100%;height:auto}
.mob .str{stroke:var(--muted);stroke-width:1.5}
.mob .bar{stroke:var(--ink);stroke-width:5;stroke-linecap:round;transition:stroke .2s}
.mob .bar.ok{stroke:var(--ok)}.mob .bar.off{stroke:var(--warn)}
.mob .pivot{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.mob .totbox{fill:var(--tile);stroke:var(--tile-edge);stroke-width:2}
.mob .totbox.ok{stroke:var(--ok);stroke-width:3}.mob .totbox.off{stroke:var(--warn);stroke-width:3}
.mob .tottxt{font:800 22px "Poppins",system-ui,sans-serif;fill:var(--tile-ink)}
.shape-inputs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin-top:14px}
.sh-in{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:600}
.sh-in .ans{width:3.4em}
.ico{width:1.4em;height:1.4em;vertical-align:-0.32em}
.eqctl{display:flex;justify-content:center;margin-top:16px}
.seg.small button{font-size:13px;padding:6px 12px}
.eqs{max-width:460px;margin:12px auto 0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 18px;font-size:19px;line-height:1.8}
.eqs ol{margin:0;padding-left:1.4em}
.eqkey{margin:0 0 4px;color:var(--muted);font-size:16px;text-align:center}
.eqnote{color:var(--muted);font-size:14px}
.term{white-space:nowrap}

.foot{display:flex;justify-content:center;margin-top:40px;padding-top:14px;border-top:1px dashed var(--line)}
.footlink{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:8px}
.footlink:hover{color:var(--ink);background:var(--panel)}
/* tracking */
.who{margin:8px 0 0;font-size:14px;color:var(--muted)}
.who strong{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;margin-left:10px;color:var(--olive);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.picker,.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;margin-top:22px}
.picker{max-width:420px;margin-left:auto;margin-right:auto;text-align:center}
.panel.narrow{max-width:420px;margin-left:auto;margin-right:auto}
.picker h2,.panel h2{font-family:"Luckiest Guy","Poppins",system-ui,sans-serif;font-weight:400;color:var(--olive);font-size:26px;letter-spacing:.01em;margin:0 0 6px}
.muted{color:var(--muted);line-height:1.5}
.small{font-size:14px}
.field{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;margin-top:10px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
textarea.field{resize:vertical;line-height:1.5}
.tfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 10px}
.tsum{font-weight:600;margin:16px 0 6px}
.missing{padding:10px 14px;border-radius:12px;background:var(--paper);font-size:14px;line-height:1.6}
.tblwrap{overflow-x:auto;margin-top:12px}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted)}
.rrow{display:grid;gap:4px;padding:12px 0;border-bottom:1px dashed var(--line)}
.toastbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
#toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:420px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast.warn{background:var(--warn);color:#fff}

@media (prefers-reduced-motion: reduce){.target.hit{animation:none}.tile{transition:none}.dot.cur{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <p class="kicker">Math Warm-Ups</p>
      <h1 id="gameTitle">Target Number</h1>
      <p class="date" id="dateLine"></p>
      <p class="who" id="who" hidden></p>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="Puzzle mode">
      <button type="button" data-mode="today" aria-pressed="true">Today’s puzzle</button>
      <button type="button" data-mode="practice" aria-pressed="false">Practice</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Games"></nav>
  <div class="levelbar" id="levelBar">
    <div class="seg" role="group" aria-label="Level">
      <button type="button" data-level="0">Level 1</button>
      <button type="button" data-level="1">Level 2</button>
      <button type="button" data-level="2">Level 3</button>
    </div>
    <p class="leveldesc" id="levelDesc"></p>
  </div>
  <section id="game" aria-live="off"></section>
  <div class="newwrap"><button type="button" class="btn primary" id="newBtn" hidden>New puzzle</button></div>
  <footer class="foot"><a id="footLink" class="footlink" href="#teacher">Teacher view</a></footer>
</main>
<div class="toastbar" aria-live="polite"><span id="toast" hidden></span></div>
<script>
// ================== SETUP: CLASS TRACKING ==================
// Paste two values from Firebase (Project settings > General > Your apps).
// Leave them blank and the games work without saving anything.
const TRACKING={
   apiKey:'AIzaSyAb8iCZJyZkUL3RSqeWzHmDd9nzaB0GimA',
  databaseURL:'https://puzzleroom-745cc-default-rtdb.firebaseio.com'
};
// ============================================================
// PURE START
const ri=(rng,n)=>Math.floor(rng()*n);
const rint=(rng,a,b)=>a+ri(rng,b-a+1);
const nz=(rng,a,b)=>{let v;do{v=rint(rng,a,b);}while(v===0);return v;};
const pick=(rng,arr)=>arr[ri(rng,arr.length)];
function shuffle(rng,arr){for(let i=arr.length-1;i>0;i--){const j=ri(rng,i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// ---- formatting ----
const MINUS='\u2212';
const fmtN=v=>v<0?MINUS+(-v):String(v);
const P=v=>v<0?`(${fmtN(v)})`:fmtN(v);
const V=x=>`<i>${x}</i>`;
const SUP=e=>e>1?`<sup>${e}</sup>`:'';
const coefPrefix=p=>p===1?'':p===-1?MINUS:fmtN(p);
function polyHTML(terms,x){ // terms [[coef,power]]
  let out='';
  for(const [c,p] of terms){
    if(c===0) continue;
    const abs=Math.abs(c);
    const body=p>0?`${abs===1?'':abs}${V(x)}${SUP(p)}`:String(abs);
    out+= out==='' ? (c<0?MINUS:'')+body : (c<0?` ${MINUS} `:' + ')+body;
  }
  return out||'0';
}
function polySub(terms,xv){
  let out='';
  for(const [c,p] of terms){
    if(c===0) continue;
    const abs=Math.abs(c);
    const body=p>0?`${abs===1?'':abs}(${fmtN(xv)})${SUP(p)}`:String(abs);
    out+= out==='' ? (c<0?MINUS:'')+body : (c<0?` ${MINUS} `:' + ')+body;
  }
  return out;
}
const binom=(x,k)=>k===0?V(x):`(${V(x)} ${k<0?'+':MINUS} ${Math.abs(k)})`; // (x - k)

// ---- rationals ----
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const R=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};};
const rAdd=(x,y)=>R(x.n*y.d+y.n*x.d,x.d*y.d);
const rMul=(x,y)=>R(x.n*y.n,x.d*y.d);
const rDiv=(x,y)=>R(x.n*y.d,x.d*y.n);
const rEq=(x,y)=>!!x&&!!y&&x.n===y.n&&x.d===y.d;
const normIn=s=>String(s).trim().replace(/[\u2212\u2013\u2014]/g,'-').replace(/\s+/g,' ');
function rParse(s){
  s=normIn(s); let m;
  if((m=s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))){const d=+m[4];if(!d)return null;const r=R(+m[2]*d+ +m[3],d);return m[1]?R(-r.n,r.d):r;}
  if((m=s.match(/^(-?\d+) ?\/ ?(-?\d+)$/))){const d=+m[2];if(!d)return null;return R(+m[1],d);}
  if((m=s.match(/^(-?)(\d*)(?:\.(\d+))?$/))&&(m[2]||m[3])){
    const frac=m[3]||'';const n=parseInt((m[2]||'0')+frac,10);const d=10**frac.length;
    return R(m[1]?-n:n,d);
  }
  return null;
}
function fracHTML(r){
  if(r.d===1) return fmtN(r.n);
  return `${r.n<0?MINUS:''}<span class="frac"><span>${Math.abs(r.n)}</span><span>${r.d}</span></span>`;
}
function decHTML(r){return fmtN(Number((r.n/r.d).toFixed(6)));}

// ---- monomials ----
function monoParse(s){
  s=normIn(s).replace(/\s/g,'').replace(/\*/g,'').replace(/²/g,'^2').replace(/³/g,'^3').replace(/⁴/g,'^4').replace(/⁵/g,'^5').replace(/⁶/g,'^6').toLowerCase();
  const m=s.match(/^([+-]?)(\d*)(x(?:\^(\d+))?)?$/);
  if(!m||(!m[2]&&!m[3])) return null;
  let c=m[2]?parseInt(m[2],10):1; if(m[1]==='-') c=-c;
  const e=m[3]?(m[4]?parseInt(m[4],10):1):0;
  return c===0?{c:0,e:0}:{c,e};
}
const monoEq=(a,b)=>!!a&&!!b&&a.c===b.c&&(a.c===0||a.e===b.e);
function monoHTML(m){if(m.e===0)return fmtN(m.c);return `${coefPrefix(m.c)}${V('x')}${SUP(m.e)}`;}

// ===================== TARGET NUMBER =====================
const TARGET_LEVELS=[
  {count:4,large:[],nLarge:0,min:12,max:60,ops:['+','−','×'],minSteps:2,int:false},
  {count:6,large:[25,50,75,100],nLarge:2,min:101,max:999,ops:['+','−','×','÷'],minSteps:3,int:false},
  {count:5,int:true,min:-80,max:80,ops:['+','−','×','÷'],minSteps:3}
];
function tApply(a,op,b){
  if(op==='+')return a+b; if(op==='−')return a-b; if(op==='×')return a*b;
  if(op==='÷')return (b!==0&&a%b===0)?a/b+0:null; return null;
}
function drawTargetNums(rng,L){
  for(;;){
    const nums=[];
    if(L.int){
      while(nums.length<L.count){const v=nz(rng,-12,12);if(!nums.includes(v))nums.push(v);}
      if(nums.filter(v=>v<0).length>=2) return shuffle(rng,nums);
      continue;
    }
    const pool=L.large.slice();
    for(let i=0;i<L.nLarge;i++) nums.push(pool.splice(ri(rng,pool.length),1)[0]);
    while(nums.length<L.count){const v=1+ri(rng,10);if(nums.filter(x=>x===v).length<2)nums.push(v);}
    return shuffle(rng,nums);
  }
}
function makeTarget(rng,L){
  for(let attempt=0;attempt<5000;attempt++){
    const nums=drawTargetNums(rng,L);
    let pool=nums.map(v=>({v,steps:[]}));
    while(pool.length>1){
      const i=ri(rng,pool.length);let j=ri(rng,pool.length-1);if(j>=i)j++;
      let A=pool[i],B=pool[j];
      if(!L.int&&A.v<B.v){const t=A;A=B;B=t;}
      const a=A.v,b=B.v;
      const choices=L.ops.filter(op=>{
        if(L.int){
          if(op==='×')return Math.abs(a)>1&&Math.abs(b)>1;
          if(op==='÷')return Math.abs(b)>1&&a%b===0;
          return tApply(a,op,b)!==0;
        }
        return op==='+'||(op==='−'&&a>b)||(op==='×'&&b>1)||(op==='÷'&&b>1&&a%b===0);
      });
      if(!choices.length)break;
      const op=pick(rng,choices);const r=tApply(a,op,b);
      if(Math.abs(r)>2000)break;
      const item={v:r,steps:A.steps.concat(B.steps,[{a,op,b,r}])};
      pool=pool.filter((_,k)=>k!==i&&k!==j);pool.push(item);
      if(item.steps.length>=L.minSteps&&r>=L.min&&r<=L.max&&!nums.includes(r)&&(!L.int||Math.abs(r)>=10)&&(pool.length===1||rng()<0.45))
        return {nums,target:r,solution:item.steps};
    }
  }
  return {nums:[2,3,4,5],target:26,solution:[{a:5,op:'×',b:4,r:20},{a:3,op:'×',b:2,r:6},{a:20,op:'+',b:6,r:26}]};
}

// ===================== FACT TRIANGLES =====================
function genTriangle(rng,level){
  const hidden=ri(rng,3); // 0 top,1 left,2 right
  if(level===0){
    let a,b;do{a=nz(rng,-12,12);b=nz(rng,-12,12);}while(Math.abs(a)<2||Math.abs(b)<2||(a>0&&b>0&&rng()<0.6));
    const vals=[R(a*b),R(a),R(b)];
    return {kind:'r',vals,html:vals.map(fracHTML),hidden,plain:rPlain(vals[hidden])};
  }
  if(level===1){
    if(rng()<0.5){
      const mk=()=>{for(;;){const q=rint(rng,2,6);const p=nz(rng,-2*q,2*q);const r=R(p,q);if(r.d>1)return r;}};
      const a=mk(),b=mk();const vals=[rMul(a,b),a,b];
      return {kind:'r',vals,html:vals.map(fracHTML),hidden,plain:rPlain(vals[hidden])};
    }
    let t;do{t=nz(rng,-9,9);}while(Math.abs(t)<2);
    let k;do{k=nz(rng,-12,12);}while(Math.abs(k)<2);
    const a=R(t,10),b=R(k);let vals=[rMul(a,b),a,b];
    if(rng()<0.5)vals=[vals[0],vals[2],vals[1]];
    return {kind:'r',vals,html:vals.map(decHTML),hidden,plain:decHTML(vals[hidden])};
  }
  const mk=()=>{const e=rint(rng,0,3);let c;do{c=nz(rng,-9,9);}while(Math.abs(c)===1&&(e===0||rng()<0.7));return {c,e};};
  let a,b;do{a=mk();b=mk();}while(a.e+b.e<2);
  const vals=[{c:a.c*b.c,e:a.e+b.e},a,b];
  return {kind:'m',vals,html:vals.map(monoHTML),hidden,plain:monoPlain(vals[hidden])};
}

// ===================== DIAMONDS =====================
function genDiamond(rng,level){
  let a,b,hide;
  if(level===0){do{a=nz(rng,-9,9);b=nz(rng,-9,9);}while(Math.abs(a)<2&&Math.abs(b)<2);hide=['top','bottom'];}
  else if(level===1){do{a=nz(rng,-12,12);b=nz(rng,-12,12);}while(Math.abs(a*b)<4);hide=['left','right'];}

  }

// ===================== MYSTERY NUMBER =====================
const isPrime=n=>{n=Math.abs(n);if(n<2)return false;for(let k=2;k*k<=n;k++)if(n%k===0)return false;return true;};
const nFactors=n=>{let c=0;for(let k=1;k<=n;k++)if(n%k===0)c++;return c;};
const isSq=n=>n>=0&&Math.round(Math.sqrt(n))**2===n;
const MYS_DOMAIN=[
  Array.from({length:100},(_,i)=>i+1),
  Array.from({length:101},(_,i)=>i-50).filter(v=>v!==0),
  Array.from({length:201},(_,i)=>i-100)

const nn=V('n');
function mysClues(rng,n,level){
  const c=[];const add=(html,test)=>c.push({html,test});
  add(n%2===0?'I am even.':'I am odd.',x=>Math.abs(x%2)===Math.abs(n%2));
  for(const k of [3,4,5,6,7,8,9,11,12]){
    if(n%k===0) add(`I am a multiple of ${k}.`,x=>x%k===0);
    else if(rng()<0.3) add(`I am not a multiple of ${k}.`,x=>x%k!==0);
  }
  if(level===0){
    add(isPrime(n)?'I am prime.':'I am not prime.',x=>isPrime(x)===isPrime(n));
    add(isSq(n)?'I am a perfect square.':'I am not a perfect square.',x=>isSq(x)===isSq(n));
    if(n>=10&&n<100){
      const t=Math.floor(n/10),o=n%10,s=t+o;
      add(`My digits add up to ${s}.`,x=>x>=10&&x<100&&Math.floor(x/10)+x%10===s);
      add(t>o?'My tens digit is greater than my ones digit.':t<o?'My tens digit is less than my ones digit.':'My two digits are the same.',
        x=>{if(x<10||x>99)return false;const a=Math.floor(x/10),b=x%10;return t>o?a>b:t<o?a<b:a===b;});
    }
    const lo=n-rint(rng,3,30);if(lo>=1)add(`I am greater than ${lo}.`,x=>x>lo);
    const hi=n+rint(rng,3,30);if(hi<=100)add(`I am less than ${hi}.`,x=>x<hi);
    const f=nFactors(n);add(`I have exactly ${f} factors.`,x=>nFactors(x)===f);
    const k=rint(rng,3,9),r=n%k;if(r)add(`When you divide me by ${k}, the remainder is ${r}.`,x=>x%k===r);
  } else if(level===1){
    add(n<0?'I am negative.':'I am positive.',x=>(x<0)===(n<0));
    const t=Math.abs(n)-rint(rng,1,20);if(t>0)add(`My absolute value is greater than ${t}.`,x=>Math.abs(x)>t);
    const u=Math.abs(n)+rint(rng,1,20);add(`My absolute value is less than ${u}.`,x=>Math.abs(x)<u);
    const m=-n-rint(rng,1,20);add(`My opposite is greater than ${fmtN(m)}.`,x=>-x>m);
    const k=rint(rng,5,30);if(n+k!==0)add(`If you add ${k} to me, the result is ${n+k<0?'negative':'positive'}.`,x=>x+k!==0&&((x+k<0)===(n+k<0)));
    const k2=rint(rng,5,30);if(n-k2!==0)add(`If you subtract ${k2} from me, the result is ${n-k2<0?'negative':'positive'}.`,x=>x-k2!==0&&((x-k2<0)===(n-k2<0)));
    const sq=n*n+rint(rng,10,300);add(`My square is less than ${sq}.`,x=>x*x<sq);
    const sq2=n*n-rint(rng,10,300);if(sq2>0)add(`My square is greater than ${sq2}.`,x=>x*x>sq2);
    add(isPrime(n)?'My absolute value is prime.':'My absolute value is not prime.',x=>isPrime(x)===isPrime(n));
  } else {
    add(n<0?`${nn} is negative.`:n>0?`${nn} is positive.`:`${nn} is neither positive nor negative.`,x=>Math.sign(x)===Math.sign(n));
    for(let t=0;t<3;t++){
      let a;do{a=nz(rng,-7,7);}while(Math.abs(a)<2);
      const b=rint(rng,-20,20);const v=a*n+b;
      const rel=pick(rng,['>','<','≥','≤']);
      const d=rint(rng,rel==='>'||rel==='<'?1:0,40);
      const cc=rel==='>'||rel==='≥'?v-d:v+d;
      const lhs=`${coefPrefix(a)}${nn}${b>0?` + ${b}`:b<0?` ${MINUS} ${-b}`:''}`;
      const test=rel==='>'?x=>a*x+b>cc:rel==='<'?x=>a*x+b<cc:rel==='≥'?x=>a*x+b>=cc:x=>a*x+b<=cc;
      add(`${lhs} ${rel} ${fmtN(cc)}`,test);
    }
    {
      const k=n+rint(rng,-15,15);const dist=Math.abs(n-k);
      const inside=k===0?`|${nn}|`:`|${nn} ${k<0?'+':MINUS} ${Math.abs(k)}|`;
      if(rng()<0.6||dist===0){const r=dist+rint(rng,0,12);add(`${inside} ≤ ${r}`,x=>Math.abs(x-k)<=r);}
      else{const r=rint(rng,0,dist-1);add(`${inside} > ${r}`,x=>Math.abs(x-k)>r);}
    }
    const m=n*n+rint(rng,1,400);add(`${nn}<sup>2</sup> < ${m}`,x=>x*x<m);
    const m2=n*n-rint(rng,1,400);if(m2>0)add(`${nn}<sup>2</sup> > ${m2}`,x=>x*x>m2);
  }

}
function genMystery(rng,level){
  const dom=MYS_DOMAIN[level];
  for(let attempt=0;attempt<3000;attempt++){
    const n=pick(rng,dom);
    const pool=mysClues(rng,n,level);
    let cand=dom.slice();const chosen=[];
    for(const cl of pool){
      const next=cand.filter(cl.test);
      if(next.length===cand.length)continue;
      if(next.length===1&&chosen.length<2)continue;
      chosen.push(cl);cand=next;
      if(cand.length===1)break;
    }
    if(cand.length===1&&chosen.length>=3&&chosen.length<=6)return {n,clues:chosen};
  }
  return null;
}

// ===================== MAGIC SQUARES =====================
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const LINE_NAMES=['Row 1','Row 2','Row 3','Column 1','Column 2','Column 3','The ↘ diagonal','The ↙ diagonal'];
const magicGrid=(c,a,b)=>[c+a,c-a-b,c+b,c-a+b,c,c+a-b,c-b,c+a+b,c-a];
function magicSolvable(known){
  const k=new Set(known);let ch=true;
  while(ch){ch=false;for(const L of LINES){const u=L.filter(x=>!k.has(x));if(u.length===1){k.add(u[0]);ch=true;}}}
  return k.size===9;
}
function genMagic(rng,level){
  let g,den=1;
  for(;;){
    let c,a,b;
    if(level===0){c=rint(rng,6,14);a=nz(rng,-6,6);b=nz(rng,-6,6);}
    else if(level===1){c=rint(rng,-4,4);a=nz(rng,-7,7);b=nz(rng,-7,7);}
    else{den=pick(rng,[2,4]);c=rint(rng,-6,6);a=nz(rng,-7,7);b=nz(rng,-7,7);}
    g=magicGrid(c,a,b);
    if(new Set(g).size!==9)continue;
    if(level===0&&Math.min(...g)<1)continue;
    if(level===1&&g.filter(v=>v<0).length<3)continue;
    if(level===2&&g.filter(v=>v%den!==0).length<4)continue;
    break;
  }
  const vals=g.map(v=>R(v,den));
  const S=R(g[0]+g[1]+g[2],den);
  let known;
  for(;;){
    if(level===2){const L=pick(rng,LINES);known=L.slice();let x;do{x=ri(rng,9);}while(known.includes(x));known.push(x);}
    else{known=shuffle(rng,[0,1,2,3,4,5,6,7,8]).slice(0,level===0?4:3);}
    if(magicSolvable(known))break;
  }
  return {vals,S,known,showSum:level!==2};
}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;

  }

  return e;
}

  const stage=h('div',{class:'stage'});
  const status=h('p',{class:'status','aria-live':'polite'});
  const extra=h('div',{class:'extra'});
  const checkB=h('button',{class:'btn primary',type:'button',onclick:()=>check()},'Check');
  const showB=h('button',{class:'btn',type:'button',onclick:()=>reveal()},'Show answer');
  const nextB=h('button',{class:'btn primary',type:'button',onclick:()=>next()},'Next');
  const againB=h('button',{class:'btn primary',type:'button',onclick:()=>{i=0;res.length=0;t0=Date.now();finished=false;load();}},'Do this set again');
  const controls=h('div',{class:'controls'},checkB,showB,nextB,againB);
  root.append(prompt,dots,stage,status,extra,controls);
  stage.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
  const setS=(t,k)=>{status.textContent=t;status.className='status'+(k?' '+k:'');};
  const inputs=()=>[...stage.querySelectorAll('input')];
  function drawDots(){
    dots.replaceChildren(...problems.map((_,k)=>h('span',{class:'dot'+(res[k]?' '+res[k]:'')+(k===i?' cur':'')})),
      h('span',{class:'count'},`${Math.min(i+1,problems.length)} of ${problems.length}`));
  }
  function load(){
    const p=problems[i];
    stage.replaceChildren(p.view());
    setS('','');extra.replaceChildren();
    checkB.hidden=false;showB.hidden=false;nextB.hidden=true;againB.hidden=true;
    drawDots();
    const f=inputs()[0];if(f)f.focus({preventScroll:true});
  }
  function finish(kind,msg){
    if(!res[i])res[i]=kind;
    setS(msg,kind==='ok'?'ok':'');
    inputs().forEach(x=>x.disabled=true);
    checkB.hidden=true;showB.hidden=true;nextB.hidden=false;
    nextB.textContent=i===problems.length-1?'See results':'Next';
    const a=problems[i].after&&problems[i].after();if(a)extra.replaceChildren(a);
    drawDots();nextB.focus({preventScroll:true});
  }
  function check(){
    if(!nextB.hidden){next();return;}
    const ins=inputs();
    if(ins.some(x=>!x.value.trim())){setS('Fill in every box first.','warn');return;}
    const r=problems[i].check();
    if(r.ok){ins.forEach(x=>x.classList.add('good'));finish('ok',r.msg||'Correct!');}
    else setS(r.msg||'Not quite. Check your work and try again.','warn');
  }
  function reveal(){problems[i].reveal();res[i]='miss';finish('miss','Here’s the answer. Compare it with your work.');}
  function next(){
    i++;
    if(i<problems.length){load();return;}
    const ok=res.filter(x=>x==='ok').length;
    const shownN=res.filter(x=>x==='miss').length;
    finished=true;if(ctx&&ctx.report)ctx.report({result:'set',score:`${ok}/${problems.length}`,detail:shownN?`${shownN} answer${shownN===1?'':'s'} shown`:'',secs:Math.round((Date.now()-t0)/1000)});
    stage.replaceChildren(h('div',{class:'summary'},h('p',{class:'big'},`${ok} of ${problems.length}`),h('p',{},'solved without showing the answer')));
    setS('','');extra.replaceChildren();dots.replaceChildren(...problems.map((_,k)=>h('span',{class:'dot '+(res[k]||'')})));
    checkB.hidden=showB.hidden=nextB.hidden=true;againB.hidden=false;
  }
  load();
}

// ---------- Target Number ----------
function mountTarget(root,rng,level,ctx){
  const L=TARGET_LEVELS[level];
  const P0=makeTarget(rng,L);
  const how=L.int
    ?'Combine the numbers with + − × ÷ to hit the target. Tap a number, an operation, then another number. Results can be negative, and division has to come out even.'
    :'Combine the numbers with + − × ÷ to hit the target. Tap a number, an operation, then another number. Each number can be used once, and every result must be a positive whole number.';
  root.innerHTML=`
    <p class="prompt">${how}</p>
    <div class="target" id="tg"><span class="num" id="tgNum"></span></div>
    <p class="status" id="tStatus" aria-live="polite"></p>
    <div class="tiles" id="tTiles" aria-label="Numbers"></div>
    <div class="ops" role="group" aria-label="Operations">
      <button type="button" class="op" data-op="+" aria-label="Add">+</button>
      <button type="button" class="op" data-op="−" aria-label="Subtract">−</button>
      <button type="button" class="op" data-op="×" aria-label="Multiply">×</button>
      <button type="button" class="op" data-op="÷" aria-label="Divide">÷</button>
    </div>
    <div class="controls">
      <button type="button" class="btn" id="tUndo">Undo</button>
      <button type="button" class="btn" id="tReset">Start over</button>
      <button type="button" class="btn" id="tSol">Show a solution</button>
    </div>
    <section class="work"><h2>Your work</h2><ol id="tSteps"></ol><p class="empty" id="tEmpty">Your steps will appear here.</p>
      <div class="meta"><span id="tClosest"></span><span id="tTimer">0:00</span></div></section>
    <section class="work solution" id="tSolBox" hidden><h2>One way to do it</h2><ol id="tSolSteps"></ol><p class="empty">There are often other ways too.</p></section>`;
  const $=id=>root.querySelector('#'+id);
  const S={tiles:[],steps:[],history:[],selA:null,op:null,solved:false,closest:null,start:null,elapsed:0,nextId:1};
  S.tiles=P0.nums.map(v=>({id:S.nextId++,v,made:false}));
  const initial=S.tiles.map(t=>({...t}));
  const eq=(a,op,b,r)=>`${fmtN(a)} ${op} ${P(b)} = ${fmtN(r)}`;
  const saveKey=`wu-target-${ctx.dateKey}-${level}`;
  const setS=(t,k)=>{const e=$('tStatus');e.textContent=t;e.className='status'+(k?' '+k:'');};
  function upClosest(){for(const t of S.tiles){if(S.closest===null||Math.abs(t.v-P0.target)<Math.abs(S.closest-P0.target))S.closest=t.v;}}
  const snap=()=>({tiles:S.tiles.map(t=>({...t})),steps:S.steps.slice(),closest:S.closest});
  function tileClick(id){
    if(S.solved)return;
    if(S.selA===null){S.selA=id;S.op=null;}
    else if(S.selA===id){S.selA=null;S.op=null;}
    else if(S.op===null){S.selA=id;}
    else{combine(S.selA,S.op,id);return;}
    setS('','');render();
  }
  function opClick(op){
    if(S.solved)return;
    if(S.selA===null){setS('Tap a number first, then an operation.','warn');return;}
    S.op=S.op===op?null:op;setS('','');render();
  }
  function combine(idA,op,idB){
    const a=S.tiles.find(t=>t.id===idA).v,b=S.tiles.find(t=>t.id===idB).v;
    if(!L.int&&op==='−'&&a<=b){setS(a===b?`${a} − ${b} is zero, and zero can’t be used. Try a different pair.`:`${a} − ${b} would be negative. Results must be positive, so try ${b} − ${a}.`,'warn');S.op=null;render();return;}
    if(op==='÷'&&b===0){setS('You can’t divide by zero.','warn');S.op=null;render();return;}
    if(op==='÷'&&a%b!==0){setS(`${fmtN(a)} ÷ ${P(b)} isn’t a whole number. Try a different pair.`,'warn');S.op=null;render();return;}
    const r=tApply(a,op,b);
    S.history.push(snap());if(S.start===null)S.start=Date.now();
    const nt={id:S.nextId++,v:r,made:true};
    S.tiles=S.tiles.map(t=>t.id===idA?nt:t).filter(t=>t.id!==idB);
    S.steps.push(eq(a,op,b,r));S.op=null;upClosest();
    if(r===P0.target){
      S.solved=true;S.selA=null;S.elapsed=Math.round((Date.now()-S.start)/1000);
      setS(`You hit ${fmtN(r)} in ${S.steps.length} step${S.steps.length===1?'':'s'} (${fmtT(S.elapsed)}).`,'ok');
      if(ctx.mode==='today')store.set(saveKey,{steps:S.steps.length,secs:S.elapsed});
      if(ctx.report)ctx.report({result:'solved',score:'Solved',detail:`${S.steps.length} steps${S.peeked?', viewed a solution first':''}`,secs:S.elapsed});
      const tg=$('tg');tg.classList.remove('hit');void tg.offsetWidth;tg.classList.add('hit');
    }else if(S.tiles.length===1){
      S.selA=null;setS(`No numbers left to combine. Your closest was ${fmtN(S.closest)}, ${Math.abs(S.closest-P0.target)} away. Undo or start over to keep trying.`,'');
    }else{S.selA=nt.id;setS('','');}
    render();
  }
  function undo(){const hh=S.history.pop();if(!hh)return;S.tiles=hh.tiles;S.steps=hh.steps;S.closest=hh.closest;S.selA=null;S.op=null;S.solved=false;setS('','');render();}
  function reset(){if(!S.steps.length)return;S.history.push(snap());S.tiles=initial.map(t=>({...t}));S.steps=[];S.selA=null;S.op=null;S.solved=false;setS('Back to the starting numbers. Undo brings your work back.','');render();}
  function render(){
    $('tgNum').textContent=fmtN(P0.target);
    const box=$('tTiles');box.replaceChildren(...S.tiles.map(t=>{
      const b=h('button',{type:'button',class:'tile'+(t.made?' made':'')+(t.id===S.selA?' sel':'')+(S.solved&&t.v===P0.target?' win':''),'aria-pressed':String(t.id===S.selA),disabled:S.solved},fmtN(t.v));
      b.addEventListener('click',()=>tileClick(t.id));return b;}));
    root.querySelectorAll('.op').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.op===S.op));b.disabled=S.solved;});
    $('tSteps').replaceChildren(...S.steps.map(s=>h('li',{},s)));
    $('tEmpty').hidden=S.steps.length>0;
    $('tClosest').textContent=S.solved?'Target hit':`Closest so far: ${fmtN(S.closest)} (${Math.abs(S.closest-P0.target)} away)`;
    $('tUndo').disabled=!S.history.length;$('tReset').disabled=!S.steps.length;
    tick();
  }
  function tick(){$('tTimer').textContent=fmtT(S.solved?S.elapsed:(S.start?Math.round((Date.now()-S.start)/1000):0));}
  $('tSolSteps').replaceChildren(...P0.solution.map(s=>h('li',{},eq(s.a,s.op,s.b,s.r))));
  root.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>opClick(b.dataset.op)));
  $('tUndo').addEventListener('click',undo);$('tReset').addEventListener('click',reset);
  $('tSol').addEventListener('click',()=>{const el=$('tSolBox');el.hidden=!el.hidden;if(!el.hidden&&!S.solved)S.peeked=true;$('tSol').textContent=el.hidden?'Show a solution':'Hide the solution';});
  upClosest();
  if(ctx.mode==='today'){const sv=store.get(saveKey);if(sv)setS(`You already solved today’s puzzle at this level in ${sv.steps} steps (${fmtT(sv.secs)}). Try another level, or play it again.`,'');}
  render();
if(ctx.pending)ctx.pending(()=>S.solved||!S.history.length?null:{result:'partial',score:'Not finished',detail:`Closest: ${fmtN(S.closest)} (${Math.abs(S.closest-P0.target)} away)`,secs:S.start?Math.round((Date.now()-S.start)/1000):0});
  const timer=setInterval(()=>{if(!S.solved)tick();},1000);
  return{
    cleanup:()=>clearInterval(timer),
    onKey:e=>{const m={'+':'+','-':'−','*':'×','x':'×','/':'÷'};
      if(m[e.key]){opClick(m[e.key]);e.preventDefault();}
      else if(e.key==='Backspace'){undo();e.preventDefault();}
      else if(e.key==='Escape'){S.selA=null;S.op=null;render();}}
  };
}

// ---------- Fact Triangles ----------
function mountTriangles(root,rng,level,ctx){
  const intros=[
    'The two bottom numbers multiply to make the top number. Find the missing one.',
    'The two bottom numbers multiply to make the top number. Answer with a fraction like −3/4 or a decimal like 2.5.',
    'The two bottom monomials multiply to make the top one. Type exponents with ^, like −6x^3.'
  ];
  const probs=[];
  for(let k=0;k<8;k++){
    const t=genTriangle(rng,level);let inp;
    probs.push({
      view(){
        inp=ansInput('Missing value');
        const wrap=h('div',{class:'tri'});
        wrap.innerHTML='<svg viewBox="0 0 300 260" aria-hidden="true"><polygon points="150,40 245,215 55,215"/></svg><span class="tri-x">×</span>';
        ['top','left','right'].forEach((pos,idx)=>{
          wrap.append(h('div',{class:'node '+pos},idx===t.hidden?inp:h('span',{class:'given',html:t.html[idx]})));
        });
        return wrap;
      },
      check(){
        const want=t.vals[t.hidden];
        if(t.kind==='m'){const g=monoParse(inp.value);if(!g)return{ok:false,msg:'Type a monomial like 4x^2 or −7x.'};return{ok:monoEq(g,want)};}
        const g=rParse(inp.value);if(!g)return{ok:false,msg:'Type a number, a fraction like 3/4, or a decimal.'};
        if(rEq(g,want))return{ok:true};
        if(rEq(g,R(-want.n,want.d)))return{ok:false,msg:'Close! Check the sign.'};
        return{ok:false};
      },
      reveal(){inp.value=t.plain;}
    });
  }
  mountRound(root,probs,intros[level],ctx);
}

// ---------- Diamonds ----------
function mountDiamonds(root,rng,level,ctx){
  const intros=[
    'The side numbers multiply to make the top and add to make the bottom. Find the top and bottom.',
    'Find two numbers that multiply to the top and add to the bottom.',
    'Top is the product, bottom is the sum. Fill in whatever is missing.'
  ];
  const probs=[];
  for(let k=0;k<8;k++){
    const d=genDiamond(rng,level);const ins={};
    probs.push({
      view(){
        const wrap=h('div',{class:'diamond'});
        wrap.innerHTML='<svg viewBox="0 0 300 300" aria-hidden="true"><polygon points="150,8 292,150 150,292 8,150"/><line x1="79" y1="79" x2="221" y2="221"/><line x1="221" y1="79" x2="79" y2="221"/></svg><span class="dlab dtop">product</span><span class="dlab dbot">sum</span>';
        for(const pos of ['top','left','right','bottom']){
          let content;
          if(d.hide.includes(pos)){ins[pos]=ansInput(pos==='top'?'Product':pos==='bottom'?'Sum':'Number');content=ins[pos];}
          else content=h('span',{class:'given'},fmtN(d.vals[pos]));
          wrap.append(h('div',{class:'node '+pos},content));
        }
        return wrap;
      },
      check(){
        const g={};for(const p of d.hide){const r=rParse(ins[p].value);if(!r||r.d!==1)return{ok:false,msg:'Type whole numbers (they can be negative).'};g[p]=r.n;}
        if(d.hide.includes('left')){
          const want=[d.vals.left,d.vals.right].sort((x,y)=>x-y).join();const got=[g.left,g.right].sort((x,y)=>x-y).join();
          if(want===got)return{ok:true};
          if(g.left*g.right===d.vals.top)return{ok:false,msg:'Those multiply to the top, but check the sum.'};
          if(g.left+g.right===d.vals.bottom)return{ok:false,msg:'Those add to the bottom, but check the product.'};
          return{ok:false};
        }
        const bad=d.hide.filter(p=>g[p]!==d.vals[p]);
        if(!bad.length)return{ok:true};
        return{ok:false,msg:bad.length===2?'Both boxes need another look.':`Check the ${bad[0]==='top'?'product':bad[0]==='bottom'?'sum':'side number'}.`};
      },
      reveal(){for(const p of d.hide)ins[p].value=fmtN(d.vals[p]);},
      after(){
        const {left:a,right:b,top:p,bottom:s}=d.vals;
        return h('div',{class:'note',html:`<strong>Algebra connection:</strong> ${polyHTML([[1,2],[s,1],[p,0]],'x')} = ${binom('x',-a)}${binom('x',-b)}`});
      }
    });
  }
  mountRound(root,probs,intros[level],ctx);
}

// ---------- Mystery Number ----------
function mountMystery(root,rng,level,ctx){
  const M=genMystery(rng,level);const t0=Date.now();const rep=r=>{if(ctx&&ctx.report)ctx.report({...r,secs:Math.round((Date.now()-t0)/1000)});};
  const intro=['I’m a whole number from 1 to 100. Read the clues and figure out who I am.',
    'I’m an integer from −50 to 50, and I’m not zero. Read the clues and figure out who I am.',
    `I’m an integer from −100 to 100. Call me ${V('n')}. Every clue below is true about me.`][level];
  let shown=1,done=false;const guesses=[];
  if(ctx&&ctx.pending)ctx.pending(()=>done||!guesses.length?null:{result:'partial',score:'Not finished',detail:`${shown}/${M.clues.length} clues, ${guesses.length} guesses`,secs:Math.round((Date.now()-t0)/1000)});
  const list=h('ol',{class:'clues'});
  const status=h('p',{class:'status','aria-live':'polite'});
  const inp=ansInput('Your guess','wide');
  const guessB=h('button',{class:'btn primary',type:'button',onclick:()=>guess()},'Guess');
  const moreB=h('button',{class:'btn',type:'button',onclick:()=>{if(shown<M.clues.length){shown++;draw();}}},'Reveal next clue');
  const showB=h('button',{class:'btn',type:'button',onclick:()=>{rep({result:'revealed',score:'Gave up',detail:`${shown}/${M.clues.length} clues, ${guesses.length} guesses`});done=true;shown=M.clues.length;setS(`The mystery number is ${fmtN(M.n)}.`,'');draw();}},'Show the number');
  const chips=h('div',{class:'chips'});
  const setS=(t,k)=>{status.textContent=t;status.className='status'+(k?' '+k:'');};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();guess();}});
  root.append(h('p',{class:'prompt',html:intro}),h('div',{class:'cluebox'},list),
    h('div',{class:'guessrow'},inp,guessB),status,chips,h('div',{class:'controls'},moreB,showB));
  function draw(){
    list.replaceChildren(...M.clues.map((c,k)=>k<shown?h('li',{html:c.html}):h('li',{class:'locked'},'Locked')));
    moreB.disabled=done||shown>=M.clues.length;inp.disabled=guessB.disabled=done;showB.disabled=done;
    chips.replaceChildren(...guesses.map(g=>h('span',{class:'chip'+(g===M.n?' right':'')},fmtN(g))));
  }
  function guess(){
    if(done)return;
    const r=rParse(inp.value);
    if(!r||r.d!==1){setS('Type a whole number (negatives are fine).','warn');return;}
    const g=r.n;const dom=MYS_DOMAIN[level];
    if(!dom.includes(g)){setS(`${fmtN(g)} is outside the range.`,'warn');return;}
    guesses.push(g);inp.value='';
    if(g===M.n){rep({result:'solved',score:'Solved',detail:`${shown}/${M.clues.length} clues, ${guesses.length} guesses`});done=true;setS(`Yes! The mystery number is ${fmtN(g)}. You used ${shown} of ${M.clues.length} clues and ${guesses.length} guess${guesses.length===1?'':'es'}.`,'ok');draw();return;}
    const broke=M.clues.slice(0,shown).findIndex(c=>!c.test(g));
    if(broke>=0)setS(`${fmtN(g)} doesn’t fit clue ${broke+1}.`,'warn');
    else setS(`${fmtN(g)} fits every clue so far, but it isn’t me. Reveal another clue.`,'');
    draw();inp.focus({preventScroll:true});
  }
  draw();
}

// ---------- Magic Squares ----------
function mountMagic(root,rng,level,ctx){
  const M=genMagic(rng,level);const t0=Date.now();const rep=r=>{if(ctx&&ctx.report)ctx.report({...r,secs:Math.round((Date.now()-t0)/1000)});};
  const show=r=>level===2?fracHTML(r):fmtN(r.n);
  const intro=M.showSum
    ?`Fill in the square so every row, column, and diagonal adds to <strong>${show(M.S)}</strong>.`
    :'Every row, column, and diagonal adds to the same magic sum. Find it, then fill in the square. Fractions like −3/4 work, and so do decimals.';
  const ins={};const status=h('p',{class:'status','aria-live':'polite'});
  const sumEls=LINES.map(()=>h('span',{class:'msum'},'?'));
  const grid=h('div',{class:'magic'});
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      const idx=r*3+c;
      if(M.known.includes(idx))grid.append(h('div',{class:'mcell given',html:show(M.vals[idx])}));
      else{ins[idx]=ansInput(`Row ${r+1}, column ${c+1}`);ins[idx].addEventListener('input',sums);grid.append(h('div',{class:'mcell'},ins[idx]));}
    }
    grid.append(sumEls[r]);
  }
  for(let c=0;c<3;c++)grid.append(sumEls[3+c]);
  grid.append(sumEls[6]);
  const diag2=h('p',{class:'diag2'},'↙ diagonal: ',sumEls[7]);
  sumEls[6].prepend('↘ ');
  const val=i=>M.known.includes(i)?M.vals[i]:rParse(ins[i].value);
  function sums(){
    LINES.forEach((L,k)=>{
      const v=L.map(val);const el=sumEls[k];const pre=k===6?'↘ ':'';
      if(v.some(x=>!x)){el.innerHTML=pre+'?';el.classList.remove('ok','off');return;}
      const s=v.reduce(rAdd,R(0));el.innerHTML=pre+fracHTML(s);
      el.classList.toggle('ok',rEq(s,M.S));el.classList.toggle('off',!rEq(s,M.S));
    });
  }
  const checkB=h('button',{class:'btn primary',type:'button',onclick:check},'Check');
  const showB=h('button',{class:'btn',type:'button',onclick:()=>{rep({result:'revealed',score:'Answer shown',detail:''});for(const i in ins){ins[i].value=rPlain(M.vals[i]);ins[i].disabled=true;}sums();setS(M.showSum?'Here’s the completed square.':`Here’s the completed square. The magic sum is ${rPlain(M.S)}.`,'');checkB.disabled=showB.disabled=true;}},'Show answer');
  const setS=(t,k)=>{status.textContent=t;status.className='status'+(k?' '+k:'');};
  function check(){
    if(Object.values(ins).some(x=>!x.value.trim())){setS('Fill in every empty box first.','warn');return;}
    for(const i in ins)if(!rParse(ins[i].value)){setS(`“${ins[i].value}” isn’t a number I can read.`,'warn');return;}
    for(let k=0;k<8;k++){
      const s=LINES[k].map(val).reduce(rAdd,R(0));
      if(!rEq(s,M.S)){setS(M.showSum?`${LINE_NAMES[k]} adds to ${rPlain(s)}, not ${rPlain(M.S)}.`:`${LINE_NAMES[k]} doesn’t match the magic sum.`,'warn');return;}
    }
    for(const i in ins){ins[i].disabled=true;ins[i].classList.add('good');}
    checkB.disabled=showB.disabled=true;
    rep({result:'solved',score:'Solved',detail:''});
    setS(M.showSum?'Magic! Every line adds to '+rPlain(M.S)+'.':`Magic! Every line adds to ${rPlain(M.S)}.`,'ok');
  }
  grid.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
  root.append(h('p',{class:'prompt',html:intro}),grid,diag2,status,h('div',{class:'controls'},checkB,showB));
  if(ctx&&ctx.pending)ctx.pending(()=>{if(checkB.disabled)return null;const v=Object.values(ins);const filled=v.filter(x=>x.value.trim()).length;return filled?{result:'partial',score:'Not finished',detail:`${filled} of ${v.length} boxes filled`,secs:Math.round((Date.now()-t0)/1000)}:null;});
  sums();
}

// ---------- Number Crunch ----------

// ---------- Balance Mobiles ----------
const MOB_CFG=[{k:2,maxV:9,bars:[1,2],maxChain:3},{k:3,maxV:12,bars:[2,3],maxChain:3},{k:4,maxV:15,bars:[3,4],maxChain:4}];
const SHAPE_NAMES=['sun','rainbow','leaf','flower'];
const LETTERS=['x','y','z','w'];
function mobRank(rows){
  const m=rows.map(r=>r.slice());const k=m[0].length;let rank=0;
  for(let c=0;c<k&&rank<m.length;c++){
    let p=-1;for(let r=rank;r<m.length;r++)if(Math.abs(m[r][c])>1e-9){p=r;break;}
    if(p<0)continue;[m[rank],m[p]]=[m[p],m[rank]];
    for(let r=0;r<m.length;r++)if(r!==rank&&Math.abs(m[r][c])>1e-9){const f=m[r][c]/m[rank][c];for(let cc=c;cc<k;cc++)m[r][cc]-=f*m[rank][cc];}
    rank++;
  }
  return rank;
}
function mobCounts(n,k){const a=Array(k).fill(0);(function walk(x){if(x.type==='chain')x.items.forEach(i=>a[i]++);else{walk(x.L);walk(x.R);}})(n);return a;}
function genMobile(rng,level){
  const C=MOB_CFG[level];
  for(let attempt=0;attempt<6000;attempt++){
    const vals=[];while(vals.length<C.k){const v=rint(rng,1,C.maxV);if(!vals.includes(v))vals.push(v);}
    const chains=[];
    (function rec(start,arr,sum){if(arr.length)chains.push({items:arr.slice(),sum});if(arr.length===C.maxChain)return;for(let s=start;s<C.k;s++){arr.push(s);rec(s,arr,sum+vals[s]);arr.pop();}})(0,[],0);
    let bars=1;
    const build=(W,depth)=>{
      const opts=chains.filter(c=>c.sum===W);
      const canBar=W%2===0&&depth<3&&bars<C.bars[1];
      if(canBar&&(rng()<0.55||!opts.length)){bars++;const L=build(W/2,depth+1);const R=L&&build(W/2,depth+1);return L&&R?{type:'bar',L,R}:null;}
      if(!opts.length)return null;
      return {type:'chain',items:shuffle(rng,pick(rng,opts).items.slice())};
    };
    const half=pick(rng,chains).sum;
    const L=build(half,1),R=L&&build(half,1);
    if(!L||!R)continue;
    const root={type:'bar',L,R};
    if(bars<C.bars[0]||bars>C.bars[1])continue;
    const total=mobCounts(root,C.k);if(total.some(c=>c===0))continue;
    const rows=[total];
    (function walk(x){if(x.type==='bar'){const l=mobCounts(x.L,C.k),r=mobCounts(x.R,C.k);rows.push(l.map((v,i)=>v-r[i]));walk(x.L);walk(x.R);}})(root);
    if(mobRank(rows)<C.k)continue;
    return {root,vals,T:half*2,k:C.k};
  }
  return null;
}
const MOB={SH:34,SGAP:6,CDROP:18,BDROP:16,MGAP:22,TILT:8};
function mobLayout(n){
  if(n.type==='chain'){n.le=n.re=MOB.SH/2+2;n.h=MOB.CDROP+n.items.length*(MOB.SH+MOB.SGAP);return;}
  mobLayout(n.L);mobLayout(n.R);
  n.arm=Math.max(30,(n.L.re+n.R.le+MOB.MGAP)/2);
  n.le=n.arm+n.L.le;n.re=n.arm+n.R.re;
  n.h=MOB.BDROP+Math.max(n.L.h,n.R.h)+n.arm*Math.sin(MOB.TILT*Math.PI/180);
}
function shapeSVG(i,cx,cy,s){
  const c=`var(--s${i})`,r=s/2,f=n=>+n.toFixed(2);
  if(i===0){
    let rays='';
    for(let k=0;k<8;k++){const a=k*Math.PI/4,ca=Math.cos(a),sa=Math.sin(a);rays+=`<line x1="${f(cx+ca*r*0.68)}" y1="${f(cy+sa*r*0.68)}" x2="${f(cx+ca*r*0.95)}" y2="${f(cy+sa*r*0.95)}"/>`;}
    return `<g stroke="${c}" stroke-width="${f(s*0.08)}" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${f(r*0.5)}" fill="${c}"/>`;
  }
  if(i===1){
    const base=cy+r*0.62,w=f(s*0.14);
    const arc=(rad,op)=>`<path d="M${f(cx-rad)},${f(base)} A${f(rad)},${f(rad)} 0 0 1 ${f(cx+rad)},${f(base)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
    return arc(r*0.9,1)+arc(r*0.58,0.65)+arc(r*0.26,0.4);
  }
  if(i===2){
    return `<path d="M${cx},${f(cy-r)} C${f(cx+r*0.95)},${f(cy-r*0.45)} ${f(cx+r*0.95)},${f(cy+r*0.45)} ${cx},${f(cy+r)} C${f(cx-r*0.95)},${f(cy+r*0.45)} ${f(cx-r*0.95)},${f(cy-r*0.45)} ${cx},${f(cy-r)} Z" fill="${c}"/>`+
      `<line x1="${cx}" y1="${f(cy-r*0.65)}" x2="${cx}" y2="${f(cy+r*0.8)}" stroke="var(--paper)" stroke-width="${f(s*0.05)}" stroke-linecap="round" opacity="0.75"/>`;
  }
  let petals='';
  for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5;petals+=`<circle cx="${f(cx+Math.cos(a)*r*0.52)}" cy="${f(cy+Math.sin(a)*r*0.52)}" r="${f(r*0.42)}" fill="${c}"/>`;}
  return petals+`<circle cx="${cx}" cy="${cy}" r="${f(r*0.28)}" fill="var(--paper)" stroke="${c}" stroke-width="${f(s*0.05)}"/>`;
}
const shapeIcon=i=>`<svg class="ico" viewBox="0 0 20 20" role="img" aria-label="${SHAPE_NAMES[i]}">${shapeSVG(i,10,10,15)}</svg>`;
function mobMarkup(n,bars){
  if(n.type==='chain'){
    const TOPS=[0.95,0.56,1,0.94],last=n.items.length-1;
    const endY=MOB.CDROP+last*(MOB.SH+MOB.SGAP)+MOB.SH/2-TOPS[n.items[last]]*MOB.SH/2;
    let s=`<line class="str" x1="0" y1="0" x2="0" y2="${endY}"/>`;
    n.items.forEach((it,k)=>{
      const top=MOB.CDROP+k*(MOB.SH+MOB.SGAP);
      s+=shapeSVG(it,0,top+MOB.SH/2,MOB.SH);
    });
    return s;
  }
  const id=bars.length;bars.push(n);n.ang=0;
  return `<line class="str" x1="0" y1="0" x2="0" y2="${MOB.BDROP}"/>`+
    `<g data-rot="${id}" transform="translate(0,${MOB.BDROP})"><line class="bar" x1="${-n.arm}" y1="0" x2="${n.arm}" y2="0"/><circle class="pivot" r="3.5"/></g>`+
    `<g data-l="${id}" transform="translate(${-n.arm},${MOB.BDROP})">${mobMarkup(n.L,bars)}</g>`+
    `<g data-r="${id}" transform="translate(${n.arm},${MOB.BDROP})">${mobMarkup(n.R,bars)}</g>`;
}
function termsHTML(counts,letters){
  const parts=[];
  counts.forEach((c,i)=>{if(!c)return;const coef=c>1?c:'';parts.push(letters?`${coef}${V(LETTERS[i])}`:`<span class="term">${coef}${shapeIcon(i)}</span>`);});
  return parts.join(' + ')||'0';
}
function mountMobiles(root,rng,level,ctx){
  const intros=[
    'Each shape has a whole-number weight, and every bar balances. The number at the top is the weight of the whole mobile. Find each shape’s weight.',
    'Same rules, three shapes. Type a guess for each shape and watch which way the bars tip.',
    'Four shapes. Each bar is an equation, so try turning on the equations and solving the system.'
  ];
  let eqMode='hide';
  const probs=[];
  for(let q=0;q<5;q++){
    const M=genMobile(rng,level);
    const ins=[];let bars,svg,eqBox,update;
    probs.push({
      view(){
        bars=[];mobLayout(M.root);
        const m=20,W=M.root.le+M.root.re+2*m,x0=M.root.le+m,topY=58,H=topY+M.root.h+16;
        const wrap=h('div',{class:'mob'});
        wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.25,640)}px" role="img" aria-label="Balance mobile weighing ${M.T}">
          <line class="str" x1="${x0}" y1="40" x2="${x0}" y2="${topY}"/>
          <rect class="totbox" x="${x0-34}" y="4" width="68" height="36" rx="10"/>
          <text class="tottxt" x="${x0}" y="29" text-anchor="middle">${M.T}</text>
          <g transform="translate(${x0},${topY})">${mobMarkup(M.root,bars)}</g></svg>`;
        svg=wrap.querySelector('svg');
        const row=h('div',{class:'shape-inputs'});
        for(let i=0;i<M.k;i++){
          ins[i]=ansInput(`Weight of the ${SHAPE_NAMES[i]}`);
          ins[i].addEventListener('input',()=>update());
          row.append(h('label',{class:'sh-in'},h('span',{html:shapeIcon(i)}),h('span',{class:'eqs-sign'},'='),ins[i]));
        }
        const seg=h('div',{class:'seg small',role:'group','aria-label':'Show equations'});
        const modes=[['hide','Hide equations'],['shapes','Shapes'],['letters','Letters']];
        eqBox=h('div',{class:'eqs'});
        const drawEq=()=>{
          seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===eqMode)));
          eqBox.hidden=eqMode==='hide';if(eqMode==='hide')return;
          const L=eqMode==='letters';
          const lines=[`${termsHTML(mobCounts(M.root,M.k),L)} = ${M.T}`];
          bars.forEach(b=>lines.push(`${termsHTML(mobCounts(b.L,M.k),L)} = ${termsHTML(mobCounts(b.R,M.k),L)}`));
          eqBox.innerHTML=(L?`<p class="eqkey">${[...Array(M.k).keys()].map(i=>`${shapeIcon(i)} = ${V(LETTERS[i])}`).join('&emsp;')}</p>`:'')+
            `<ol>${lines.map((l,k)=>`<li>${l}${k===0?' <span class="eqnote">(whole mobile)</span>':''}</li>`).join('')}</ol>`;
        };
        modes.forEach(([k,lab])=>seg.append(h('button',{type:'button','data-m':k,onclick:()=>{eqMode=k;drawEq();}},lab)));
        drawEq();
        const guess=()=>ins.map(x=>{const r=rParse(x.value);return r&&r.d===1?r.n:null;});
        const weight=(n,g)=>{if(n.type==='chain'){let s=0;for(const i of n.items){if(g[i]==null)return null;s+=g[i];}return s;}const a=weight(n.L,g),b=weight(n.R,g);return a==null||b==null?null:a+b;};
        let raf=null;
        const place=()=>{
          bars.forEach((b,id)=>{
            const t=b.ang*Math.PI/180,c=Math.cos(t),s=Math.sin(t);
            svg.querySelector(`[data-rot="${id}"]`).setAttribute('transform',`translate(0,${MOB.BDROP}) rotate(${b.ang})`);
            svg.querySelector(`[data-l="${id}"]`).setAttribute('transform',`translate(${-b.arm*c},${MOB.BDROP-b.arm*s})`);
            svg.querySelector(`[data-r="${id}"]`).setAttribute('transform',`translate(${b.arm*c},${MOB.BDROP+b.arm*s})`);
          });
        };
        const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        update=()=>{
          const g=guess();
          bars.forEach((b,id)=>{
            const wl=weight(b.L,g),wr=weight(b.R,g);
            b.target=wl==null||wr==null||wl===wr?0:(wl>wr?-MOB.TILT:MOB.TILT);
            const line=svg.querySelector(`[data-rot="${id}"] .bar`);
            line.classList.toggle('ok',wl!=null&&wr!=null&&wl===wr);
            line.classList.toggle('off',wl!=null&&wr!=null&&wl!==wr);
          });
          const tw=weight(M.root,g);
          svg.querySelector('.totbox').classList.toggle('ok',tw===M.T);
          svg.querySelector('.totbox').classList.toggle('off',tw!=null&&tw!==M.T);
          if(reduce){bars.forEach(b=>b.ang=b.target);place();return;}
          if(raf)cancelAnimationFrame(raf);
          const step=()=>{let moving=false;bars.forEach(b=>{const d=b.target-b.ang;if(Math.abs(d)>0.05){b.ang+=d*0.18;moving=true;}else b.ang=b.target;});place();if(moving)raf=requestAnimationFrame(step);};
          raf=requestAnimationFrame(step);
        };
        this._guess=guess;this._weight=weight;
        return h('div',{},wrap,row,h('div',{class:'eqctl'},seg),eqBox);
      },
      check(){
        const g=this._guess();
        if(g.some(v=>v==null))return{ok:false,msg:'Each weight should be a whole number.'};
        if(g.every((v,i)=>v===M.vals[i]))return{ok:true,msg:'Balanced! Every bar is level.'};
        const tw=this._weight(M.root,g);
        if(tw!==M.T)return{ok:false,msg:`Your shapes add up to ${fmtN(tw)}, but the whole mobile weighs ${M.T}.`};
        return{ok:false,msg:'The total works, but at least one bar is tipping. Look for the red bar.'};
      },
      reveal(){M.vals.forEach((v,i)=>ins[i].value=v);update();},
      after(){
        return h('div',{class:'note',html:`<strong>Algebra connection:</strong> ${M.vals.map((v,i)=>`${V(LETTERS[i])} = ${v}`).join(', ')} solves this system:<br>`+
          [`${termsHTML(mobCounts(M.root,M.k),true)} = ${M.T}`,...bars.map(b=>`${termsHTML(mobCounts(b.L,M.k),true)} = ${termsHTML(mobCounts(b.R,M.k),true)}`)].join('<br>')});
      }
    });
  }
  mountRound(root,probs,intros[level],ctx);
}

async function trkFetch(path,opts){const r=await fetch(trkBase()+path,opts);if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}

async function trkFlush(){
  if(TRK.flushing||!trkQ.length)return !trkQ.length;
  TRK.flushing=true;
  try{
    while(trkQ.length){
      const rec=trkQ[0];

    box.replaceChildren(h('div',{class:'panel narrow'},h('h2',{},'Teacher sign-in'),
      h('p',{class:'muted'},'Use the email and password you added in Firebase Authentication.'),em,pw,
      h('div',{class:'controls'},h('button',{class:'btn primary',type:'button',onclick:go},'Sign in')),st));
  }
  async function dash(){
    let roster=[];try{roster=await trkLoadRoster();}catch(e){}
    let rows=[];
    const date=h('input',{class:'field',type:'date','aria-label':'Date'});date.value=dayKey(new Date());
    const cls=h('select',{class:'field','aria-label':'Class'},h('option',{value:''},'All classes'),...roster.map(r=>h('option',{value:r.period},r.period)));
    const gm=h('select',{class:'field','aria-label':'Game'},h('option',{value:''},'All games'),...GAMES.map(g=>h('option',{value:g.id},g.name)));
    const st=h('p',{class:'status'});const out=h('div',{});
    const filtered=()=>rows.filter(r=>(!cls.value||r.period===cls.value)&&(!gm.value||r.game===gm.value));
    async function load(quiet){
      if(!quiet){st.className='status';st.textContent='Loading…';}
      try{
        const tok=await teacherToken();if(!tok){signIn('Please sign in again.');return;}
        const data=await trkFetch(`/submissions/${date.value}.json?auth=${encodeURIComponent(tok)}`);
        rows=Object.values(data||{}).sort((a,b)=>a.ts-b.ts);st.textContent='';draw();
      }catch(e){st.className='status warn';st.textContent=denied(e)?'Permission denied. Check that your User UID is in the database rules.':'Couldn’t load records. Check your connection and try again.';}
    }
    function draw(){
      const f=filtered();const people=new Set(f.map(r=>r.period+'|'+r.name));
      let extra=h('p',{class:'muted small'},'Pick a class to see who hasn’t finished a puzzle yet.');
      const rc=roster.find(r=>r.period===cls.value);
      if(rc){const done=new Set(f.map(r=>r.name));const miss=rc.names.filter(n=>!done.has(n));
        extra=h('div',{class:'missing'},h('strong',{},miss.length?`No entries yet (${miss.length}): `:'Everyone in this class has an entry.'),miss.join(', '));}
      const head=['Time','Class','Name','Game','Level','Mode','Result','Details','Time spent'];
      const table=h('div',{class:'tblwrap'},h('table',{class:'tbl'},
        h('thead',{},h('tr',{},...head.map(t=>h('th',{},t)))),
        h('tbody',{},...f.map(r=>h('tr',{},
          h('td',{},new Date(r.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})),h('td',{},r.period),h('td',{},r.name),
          h('td',{},r.gameName||r.game),h('td',{},String(r.level)),h('td',{},r.mode==='today'?'Today':'Practice'),
          h('td',{},r.score||''),h('td',{},r.detail||''),h('td',{},r.secs!=null?fmtT(r.secs):''))))));
      out.replaceChildren(h('p',{class:'tsum'},`${f.length} entr${f.length===1?'y':'ies'} from ${people.size} student${people.size===1?'':'s'}`),extra,
        f.length?table:h('p',{class:'muted'},'No entries for this selection.'));
    }
    function csv(){
      const esc=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
      const lines=[['Date','Time','Class','Name','Game','Level','Mode','Result','Details','Seconds'].join(','),
        ...filtered().map(r=>[r.day,new Date(r.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),r.period,r.name,r.gameName||r.game,r.level,r.mode==='today'?'Today':'Practice',r.score,r.detail||'',r.secs??''].map(esc).join(','))];
      const a=h('a',{href:URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})),download:`warm-ups-${date.value}${cls.value?'-'+cls.value:''}.csv`});
      document.body.append(a);a.click();a.remove();
    }
    date.addEventListener('change',load);cls.addEventListener('change',draw);gm.addEventListener('change',draw);
    box.replaceChildren(h('div',{class:'panel'},
      h('div',{class:'tfilters'},date,cls,gm),
      h('div',{class:'controls'},h('button',{class:'btn primary',type:'button',onclick:load},'Refresh'),
        h('button',{class:'btn',type:'button',onclick:csv},'Download CSV'),
        h('button',{class:'btn',type:'button',onclick:()=>editRoster(roster)},'Edit class lists'),
        h('button',{class:'btn',type:'button',onclick:()=>{teachMem=null;store.set('wu-teacher',null);signIn();}},'Sign out')),
      h('p',{class:'muted small'},'Today’s records refresh on their own every 20 seconds.'),st,out));
    load();
    clearInterval(timer);
    timer=setInterval(()=>{if(document.hidden||!out.isConnected)return;if(date.value===dayKey(new Date()))load(true);},20000);
  }
  function editRoster(roster){
    const list=h('div',{});
    const addRow=(p,names)=>{
      const pi=h('input',{class:'field',placeholder:'Class name, like 7M','aria-label':'Class name'});pi.value=p||'';
      const ta=h('textarea',{class:'field',rows:'8',placeholder:'One student per line','aria-label':'Student names'});ta.value=(names||[]).join('\n');
      const row=h('div',{class:'rrow'},pi,ta,h('div',{},h('button',{class:'btn',type:'button',onclick:()=>row.remove()},'Remove this class')));
      list.append(row);
    };
    (roster.length?roster:[{}]).forEach(r=>addRow(r.period,r.names));
    const st=h('p',{class:'status'});
    const save=async()=>{
      const data=[...list.querySelectorAll('.rrow')].map(r=>({period:r.querySelector('input').value.trim(),
        names:[...new Set(r.querySelector('textarea').value.split('\n').map(s=>s.trim()).filter(Boolean))]})).filter(r=>r.period&&r.names.length);
      st.className='status';st.textContent='Saving…';
      try{const tok=await teacherToken();if(!tok){signIn('Please sign in again.');return;}
        await trkFetch(`/roster.json?auth=${encodeURIComponent(tok)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        st.className='status ok';st.textContent=`Saved ${data.length} class list${data.length===1?'':'s'}.`;
      }catch(e){st.className='status warn';st.textContent=denied(e)?'Permission denied. Check that your User UID is in the database rules.':'Couldn’t save. Check your connection and try again.';}
    };
    box.replaceChildren(h('div',{class:'panel'},h('h2',{},'Class lists'),
      h('p',{class:'muted'},'Students choose their class, then their name. First name and last initial works well, like “Ana B.”'),list,
      h('div',{class:'controls'},h('button',{class:'btn',type:'button',onclick:()=>addRow()},'Add a class'),
        h('button',{class:'btn primary',type:'button',onclick:save},'Save class lists'),
        h('button',{class:'btn',type:'button',onclick:()=>dash()},'Back to records')),st));
  }
}

(function(){
  const today=new Date();
  const dateKey=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  const levels=store.get('wu-levels')||{};
  let mode='today',game=null,handle={},view=null,pendingFn=null,pendCtx=null;
  function flushPending(){const f=pendingFn;pendingFn=null;if(!f||!pendCtx)return;let rec=null;try{rec=f();}catch(e){}if(rec)trkReport({...pendCtx,...rec});}
  const $=id=>document.getElementById(id);
  $('tabs').replaceChildren(...GAMES.map(g=>h('a',{class:'tab',href:'#'+g.id,'data-game':g.id},g.name)));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(mode!==b.dataset.mode){mode=b.dataset.mode;mount(true);}}));
  document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{const lv=+b.dataset.level;if(levels[game.id]!==lv){levels[game.id]=lv;store.set('wu-levels',levels);mount(true);}}));
  $('newBtn').addEventListener('click',()=>mount(true));
  function renderWho(){
    const w=$('who');
    if(view!=='game'||!TRK.on||!TRK.student){w.hidden=true;return;}
    w.hidden=false;
    w.replaceChildren('Playing as ',h('strong',{},TRK.student.name),` (${TRK.student.period})`,
      h('button',{type:'button',class:'linkbtn',onclick:()=>{flushPending();TRK.student=null;TRK.skip=false;store.set('wu-student',null);mount();}},'Switch'));
  }
  function renderFoot(teacher){
    const a=$('footLink');
    if(teacher){a.textContent='← Back to the games';a.href='#'+(game?game.id:GAMES[0].id);a.removeAttribute('target');a.removeAttribute('rel');}
    else{a.textContent='Teacher view';a.href=location.href.split('#')[0]+'#teacher';a.target='_blank';a.rel='noopener';}
  }
  function mount(){
    flushPending();if(handle.cleanup)handle.cleanup();handle={};
    const root=$('game');root.replaceChildren();
    const teacher=view==='teacher';
    renderFoot(teacher);
    $('modeSeg').hidden=teacher;$('tabs').hidden=teacher;
    if(teacher){
      $('levelBar').hidden=true;$('newBtn').hidden=true;
      $('gameTitle').textContent='Teacher View';$('dateLine').textContent='Class records';
      document.title='Teacher View: Math Warm-Ups';renderWho();handle=mountTeacher(root)||{};return;
    }
    const lv=levels[game.id]??0;
    $('dateLine').textContent=mode==='today'?today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):'Practice';
    $('gameTitle').textContent=game.name;
    document.title=`${game.name}: Math Warm-Ups`;
    document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.game===game.id)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
    document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
    document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===lv)));
    $('levelDesc').textContent=game.levels[lv];
    renderWho();
    if(TRK.on&&!TRK.student&&!TRK.skip){
      $('levelBar').hidden=true;$('newBtn').hidden=true;$('modeSeg').hidden=true;
      renderPicker(root,()=>mount());return;
    }
    $('levelBar').hidden=false;
    $('newBtn').hidden=mode!=='practice';
    const seed=mode==='today'?hashStr(`${dateKey}|${game.id}|${lv}`):Math.floor(Math.random()*2**32);
    const base={game:game.id,gameName:game.name,level:lv+1,mode};
    const report=rec=>trkReport({...base,...rec});
    const pending=f=>{pendingFn=f;pendCtx=base;};
    handle=game.mount(root,mulberry32(seed),lv,{mode,dateKey,report,pending})||{};
  }
  function route(){
    const id=location.hash.slice(1);
    if(id==='teacher'){if(view!=='teacher'){view='teacher';mount();}return;}
    const g=GAMES.find(x=>x.id===id)||GAMES[0];
    if(view!=='game'||game!==g){view='game';game=g;mount();}
  }
  window.addEventListener('hashchange',route);
  document.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('input,select,textarea'))return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(handle.onKey)handle.onKey(e);
  });
  window.addEventListener('pagehide',flushPending);
  if(TRK.on)trkFlush();
  route();
})();
</script>
